# https://github.com/hvalev/mergerfs-docker/tree/main

services:
  mergerfs:
    image: hvalev/mergerfs:latest
    container_name: mergerfs
    environment:
      MERGERFS_PARAMS: 'moveonenospc=true,dropcacheonclose=true,category.create=mfs,cache.files=partial'
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    volumes:
      - /mnt//Drive2/usenet:/mnt/Drive2/usenet	# - /mnt/hd1:/disks/hd1
      - /mnt//Drive3/media:/mnt/Drive3/media		# - /mnt/hd2:/disks/hd2
      - /mnt/Drive2/torrents:/mnt/Drive2/torrents	# - /mnt/hd3:/disks/hd3
      - /mnt/Drive4:/merged:shared		# - /mnt/hd:/merged:shared	
    restart: always

  samba:
    image: elswork/samba:3.2.8
    container_name: samba
    environment:
      TZ: 'Europe/Amsterdam'
    ports:
      - 139:139
      - 445:445
    volumes:
      - /mnt/hd:/mnt/hd
    command: '-u "1000:1000:user:user:user_password" 
              -u "1000:1000:guest:guest:guest_password"
              -s "hd:/mnt/hd:rw:user"
              -s "media:/mnt/hd:rw:guest"'  # was :ro for read only - changed by me for ease of use
    restart: unless-stopped
    depends_on:
      - mergerfs
